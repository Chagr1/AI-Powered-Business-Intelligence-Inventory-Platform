name: Backend CI (FastAPI)

# These workflows run automatically whenever code is pushed to the 'main' or 'master' branch,
# or when a pull request is opened targeting either branch.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest  # Tests run on a Linux machine hosted by GitHub.

    # Start a temporary PostgreSQL service for database testing.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set Up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project dependencies if requirements.txt exists.
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install additional tools required for testing.
        pip install pytest httpx passlib argon2-cffi psycopg2-binary

    - name: Run Tests with Pytest
      # Provide the temporary database URL as an environment variable for the tests.
      env:
        DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
        GROQ_API_KEY: "dummy_key_for_testing" # A real API key is not required because the API calls are mocked.
      run: |
        pytest -v -s